
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time and Distance: Journey Graphs – Mr. McLean Math</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--text:#1f2937;--muted:#667085;--border:#dfe3e8;
  --accent:#2563eb;--soft:#eaf1ff;--good:#15803d;--bad:#b42318;
  --shadow:0 10px 28px rgba(16,24,40,.08);--radius:18px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 14px 28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.12}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}
.tabs,.levels,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
button.primary,.tab.active,.level.active{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.canvas-wrap{border:1px solid var(--border);border-radius:14px;background:#fff;padding:8px;display:flex;justify-content:center}
canvas{width:100%;height:auto;max-width:760px;border-radius:10px;display:block}
.question{font-size:18px;font-weight:850;line-height:1.4;margin:14px 0 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choice{text-align:left}
.choice.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.choice.correct{border-color:var(--good);background:#f0fdf4}
.choice.wrong{border-color:var(--bad);background:#fef3f2}
.answer-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.answer-row input{width:220px;max-width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:12px}
.unit{color:var(--muted);font-size:13px;font-weight:800}
.feedback{display:none;margin-top:12px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:#fafafa}
.feedback.good{display:block;border-color:#a7d7b2}.feedback.bad{display:block;border-color:#edb4ae}
.feedback-title{font-weight:900}.feedback.good .feedback-title{color:var(--good)}.feedback.bad .feedback-title{color:var(--bad)}
.feedback-sub{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}
.footer-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.score{font-size:13px;font-weight:800;color:var(--muted)}
.key-idea{margin-top:12px;padding:10px 12px;background:var(--soft);border:1px solid #cfddff;border-radius:12px;color:#344054;font-size:13px;line-height:1.4}
.worksheet{display:none}
.ws-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 10px}
.ws-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ws-card{border:1px solid var(--border);border-radius:14px;padding:10px;break-inside:avoid}
.ws-card img{display:block;width:100%;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.ws-q{font-size:13px;font-weight:800;line-height:1.4}
.ws-options{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.ws-answer{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;font-weight:800;color:var(--good)}
.ws-answer.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:720px){.choices,.ws-list{grid-template-columns:1fr}}
@media print{
  body{background:#fff}.wrap{max-width:none;padding:0}
  header,#practicePanel,.no-print,.footer{display:none!important}
  #worksheetPanel{display:block!important;border:0;box-shadow:none;padding:0}
  .ws-list{grid-template-columns:1fr 1fr}.ws-answer{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Time and Distance: Journey Graphs</h1>
    <p class="subtitle">Read and reason from distance–time graphs.</p>
  </div>
  <div class="tabs">
    <button id="practiceTab" class="tab active" type="button">Practice</button>
    <button id="worksheetTab" class="tab" type="button">Worksheet</button>
  </div>
</header>

<section id="practicePanel" class="panel">
  <div class="toolbar">
    <div>
      <div class="label">Level</div>
      <div class="levels">
        <button class="level active" data-level="basic" type="button">Basic</button>
        <button class="level" data-level="advanced" type="button">Advanced</button>
      </div>
    </div>
    <button id="newBtn" type="button">New Question</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="graph" width="760" height="460" aria-label="Distance-time graph"></canvas>
  </div>

  <div class="question" id="question">Loading…</div>
  <div id="answerArea"></div>

  <div class="footer-row">
    <div class="row">
      <button class="primary" id="checkBtn" type="button">Check</button>
      <button id="nextBtn" type="button" disabled>Next</button>
    </div>
    <div class="score">Correct: <span id="correct">0</span> &nbsp; Incorrect: <span id="incorrect">0</span></div>
  </div>

  <div id="feedback" class="feedback">
    <div id="feedbackTitle" class="feedback-title"></div>
    <div id="feedbackSub" class="feedback-sub"></div>
  </div>

  <div id="idea" class="key-idea">Basic: moving away, stopping, reading distances, and comparing steepness.</div>
</section>

<section id="worksheetPanel" class="panel worksheet">
  <div class="ws-top">
    <div>
      <div style="font-size:19px;font-weight:900">Worksheet</div>
      <div class="subtitle" id="wsMeta">Generate printable graph questions.</div>
    </div>
    <div class="row no-print">
      <label style="font-size:13px;font-weight:800;color:var(--muted)">Problems
        <select id="wsCount"><option>5</option><option selected>10</option><option>15</option></select>
      </label>
      <button class="primary" id="generateWs" type="button">Generate</button>
      <button id="revealAll" type="button" disabled>Reveal All</button>
      <button id="hideAll" type="button" disabled>Hide All</button>
      <button id="printWs" type="button" disabled>Print</button>
    </div>
  </div>
  <div id="wsList" class="ws-list"></div>
</section>

<div class="footer">Created by Mr. McLean Math.</div>
</div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const choice=a=>a[randInt(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const approx=(a,b,e=1e-9)=>Math.abs(a-b)<e;
const round1=x=>Math.round(x*10)/10;

let level="basic",current=null,evaluated=false,correctCount=0,incorrectCount=0,worksheetData=[];
const canvas=$("graph"),ctx=canvas.getContext("2d");

function formatTime(mins){
  const h=Math.floor(mins/60),m=mins%60;
  if(m===0)return h+" h";
  return h+":"+(m<10?"0":"")+m;
}
function formatInterval(a,b){return `${formatTime(a)} to ${formatTime(b)}`;}

function getSegments(g){
  const out=[];
  for(let i=0;i<g.times.length-1;i++){
    const t1=g.times[i],t2=g.times[i+1],d1=g.dist[i],d2=g.dist[i+1];
    const dtH=(t2-t1)/60,dd=d2-d1;
    out.push({i,t1,t2,d1,d2,dd,dtH,speed:dtH?dd/dtH:0});
  }
  return out;
}
const SPEEDS=[25,45,65,85,105],MIN_SPEED_DIFF=18;
function pickSeparated(existing){
  for(let k=0;k<30;k++){const s=choice(SPEEDS);if(existing.every(x=>Math.abs(x-s)>=MIN_SPEED_DIFF))return s}
  return choice(SPEEDS);
}

function generateGraph(advanced){
  const maxMins=360;
  const step=Math.random()<.4?30:60;
  const segCount=randInt(3,5);
  const times=[0];let t=0;
  while(times.length<segCount+1 && t+step<=maxMins){let add=(step===30&&Math.random()<.22)?60:step;t+=add;if(t<=maxMins)times.push(t)}
  while(times.length<4&&t+step<=maxMins){t+=step;times.push(t)}
  const dist=[0];let d=0,stops=randInt(0,2),hasMove=false,hasDown=false;const used=[];
  for(let i=1;i<times.length;i++){
    const dt=(times[i]-times[i-1])/60;let delta=0;
    if(stops>0&&Math.random()<.22){stops--;}
    else{
      const goDown=advanced&&d>0&&Math.random()<.22;
      let mag=pickSeparated(used)*dt;
      if(!approx(mag,Math.round(mag)))mag=round1(mag);
      if(approx(mag,Math.round(mag)))mag=Math.round(mag/10)*10;
      delta=goDown?-mag:mag;
      if(d+delta>420)delta=Math.floor((420-d)/10)*10;
      if(d+delta<0)delta=-Math.floor(d/10)*10;
      if(delta===0){
        mag=pickSeparated(used)*dt;
        if(!approx(mag,Math.round(mag)))mag=round1(mag);
        if(approx(mag,Math.round(mag)))mag=Math.round(mag/10)*10;
        delta=goDown?-mag:mag;
        if(d+delta>420)delta=420-d;
        if(d+delta<0)delta=-d;
      }
      if(delta!==0){hasMove=true;used.push(Math.abs(delta)/dt)}
      if(delta<0)hasDown=true;
    }
    d=clamp(d+delta,0,420);dist.push(d);
  }
  if(!hasMove && dist.length>1)dist[dist.length-1]=clamp(dist[dist.length-2]+60,0,420);
  if(advanced&&!hasDown&&Math.random()<.55&&dist.length>=3&&dist[dist.length-2]>0){
    dist[dist.length-1]=clamp(dist[dist.length-2]-Math.min(dist[dist.length-2],60),0,420);
  }
  const maxDist=Math.max(...dist);
  const yTop=maxDist<=150?200:maxDist<=250?300:maxDist<=350?400:500;
  const xTop=Math.ceil(Math.max(times[times.length-1],120)/60)*60;
  return {times,dist,xTop,yTop};
}

function drawGraph(g){
  const W=canvas.width,H=canvas.height,pL=70,pR=20,pT=25,pB=60,pW=W-pL-pR,pH=H-pT-pB;
  const x=t=>pL+(t/g.xTop)*pW,y=d=>pT+pH-(d/g.yTop)*pH;
  ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const xTick=g.xTop<=240?30:60,yTick=g.yTop<=300?50:100;
  ctx.strokeStyle="#c7cbd1";ctx.lineWidth=1;
  for(let xx=0;xx<=g.xTop;xx+=xTick/2){ctx.beginPath();ctx.moveTo(x(xx),pT);ctx.lineTo(x(xx),pT+pH);ctx.stroke()}
  for(let yy=0;yy<=g.yTop;yy+=yTick/5){ctx.beginPath();ctx.moveTo(pL,y(yy));ctx.lineTo(pL+pW,y(yy));ctx.stroke()}
  ctx.strokeStyle="#5f6670";ctx.lineWidth=1.6;
  for(let xx=0;xx<=g.xTop;xx+=xTick){ctx.beginPath();ctx.moveTo(x(xx),pT);ctx.lineTo(x(xx),pT+pH);ctx.stroke()}
  for(let yy=0;yy<=g.yTop;yy+=yTick){ctx.beginPath();ctx.moveTo(pL,y(yy));ctx.lineTo(pL+pW,y(yy));ctx.stroke()}
  ctx.strokeStyle="#111827";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pL,pT);ctx.lineTo(pL,pT+pH);ctx.lineTo(pL+pW,pT+pH);ctx.stroke();
  ctx.fillStyle="#111827";ctx.font="700 14px system-ui";ctx.textAlign="left";ctx.fillText("Distance (km)",12,18);ctx.fillText("Time",pL+pW-35,pT+pH+48);
  ctx.font="12px system-ui";ctx.fillStyle="#475467";
  for(let xx=0;xx<=g.xTop;xx+=xTick){ctx.textAlign="center";ctx.fillText(formatTime(xx),x(xx),pT+pH+20)}
  for(let yy=0;yy<=g.yTop;yy+=yTick){ctx.textAlign="right";ctx.fillText(String(yy),pL-8,y(yy)+4)}
  ctx.strokeStyle="#b42318";ctx.lineWidth=6;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x(g.times[0]),y(g.dist[0]));
  for(let i=1;i<g.times.length;i++)ctx.lineTo(x(g.times[i]),y(g.dist[i]));ctx.stroke();
  ctx.fillStyle="#b42318";for(let i=0;i<g.times.length;i++){ctx.beginPath();ctx.arc(x(g.times[i]),y(g.dist[i]),5,0,Math.PI*2);ctx.fill()}
}

function totalDistance(segs){return segs.reduce((s,x)=>s+Math.abs(x.dd),0)}
function turningTime(segs){
  for(let i=1;i<segs.length;i++){if((segs[i-1].dd>0&&segs[i].dd<0)||(segs[i-1].dd<0&&segs[i].dd>0))return segs[i].t1}
  return null;
}
function maxDistance(g){return Math.max(...g.dist)}
function mc(prompt,opts,idx,explanation){return {type:"mc",prompt,options:opts,correctIndex:idx,answerText:opts[idx],explanation}}
function inputQ(prompt,value,unit,explanation){return {type:"input",prompt,correctValue:value,unit,explanation}}
function numericOptions(correct,unit,steps){
  const vals=new Set([correct]);
  const candidates=shuffle(steps.map(x=>Math.max(0,correct+x)));
  for(const v of candidates){vals.add(v);if(vals.size===4)break}
  while(vals.size<4)vals.add(correct+vals.size*10);
  const options=shuffle([...vals]).map(v=>`${v} ${unit}`);
  return {options,idx:options.indexOf(`${correct} ${unit}`)};
}
function safeTimeOptions(correct,g){
  // Use graph times first, then nearby grid times. This cannot loop forever.
  const pool=new Set(g.times.slice(1));
  const step=g.xTop<=240?30:60;
  for(let t=step;t<=g.xTop;t+=step)pool.add(t);
  pool.add(correct);
  let vals=shuffle([...pool].filter(Number.isFinite));
  if(!vals.includes(correct))vals.unshift(correct);
  vals=vals.slice(0,4);
  while(vals.length<4){const candidate=vals.length*step; if(!vals.includes(candidate))vals.push(candidate); else vals.push(g.xTop+vals.length*step)}
  const opts=shuffle(vals.map(formatTime));
  return {options:opts,idx:opts.indexOf(formatTime(correct))};
}

function generateQuestion(g,advanced){
  const segs=getSegments(g),moving=segs.filter(s=>s.dd!==0),down=segs.filter(s=>s.dd<0),stopped=segs.filter(s=>s.dd===0);
  const types=["endDistance","distanceBetween","distanceAtTime","greatest"];
  if(moving.length)types.push("fastest");
  if(moving.length>=2)types.push("slowest","compare");
  if(stopped.length)types.push("stopped","stopDuration");
  if(advanced){
    if(down.length)types.push("movingBack","totalTraveled");
    if(turningTime(segs)!==null)types.push("turnAround");
    types.push("distanceFromStartEnd");
  }
  const type=choice(types);

  if(type==="fastest"||type==="slowest"){
    const target=moving.reduce((best,s)=>{
      if(!best)return s;
      return type==="fastest"?(Math.abs(s.speed)>Math.abs(best.speed)?s:best):(Math.abs(s.speed)<Math.abs(best.speed)?s:best);
    },null);
    let optsSeg=shuffle(segs);
    if(!optsSeg.some(s=>s.i===target.i))optsSeg.unshift(target);
    optsSeg=[target,...optsSeg.filter(s=>s.i!==target.i)].slice(0,Math.min(4,segs.length));
    const options=shuffle(optsSeg).map(s=>formatInterval(s.t1,s.t2));
    return mc(type==="fastest"?"Between which times was the person moving the fastest?":"Between which times was the person moving the slowest (but still moving)?",
      options,options.indexOf(formatInterval(target.t1,target.t2)),
      type==="fastest"?"Fastest means the steepest moving line.":"Slowest while moving means the least steep moving line.");
  }
  if(type==="stopped"){
    const s=choice(stopped);let opts=[s,...shuffle(segs.filter(x=>x.i!==s.i))].slice(0,Math.min(4,segs.length));
    const options=shuffle(opts).map(x=>formatInterval(x.t1,x.t2));
    return mc("Between which times was the person stopped (not moving)?",options,options.indexOf(formatInterval(s.t1,s.t2)),"A horizontal line means the distance stays the same.");
  }
  if(type==="movingBack"){
    const s=choice(down);let opts=[s,...shuffle(segs.filter(x=>x.i!==s.i))].slice(0,Math.min(4,segs.length));
    const options=shuffle(opts).map(x=>formatInterval(x.t1,x.t2));
    return mc("Between which times was the person moving back toward the start?",options,options.indexOf(formatInterval(s.t1,s.t2)),"A downward line means the distance from the start is decreasing.");
  }
  if(type==="turnAround"){
    const t=turningTime(segs),o=safeTimeOptions(t,g);
    return mc("At what time did the person turn around (change direction)?",o.options,o.idx,"Turning around is where the graph changes from rising to falling or falling to rising.");
  }
  if(type==="compare"){
    const [a,b]=shuffle(moving).slice(0,2);
    const options=[formatInterval(a.t1,a.t2),formatInterval(b.t1,b.t2),"They are the same speed"];
    let idx=2;if(Math.abs(a.speed)>Math.abs(b.speed))idx=0;else if(Math.abs(b.speed)>Math.abs(a.speed))idx=1;
    return mc("Which interval shows the faster speed?",options,idx,"Faster speed means a steeper line.");
  }
  if(type==="stopDuration"){
    const s=choice(stopped),mins=s.t2-s.t1,o=numericOptions(mins,"min",[-60,-30,-15,15,30,60]);
    return mc(`For how long was the person stopped between ${formatTime(s.t1)} and ${formatTime(s.t2)}?`,o.options,o.idx,"Find the time difference across the horizontal segment.");
  }
  if(type==="distanceBetween"){
    const s=choice(segs),v=Math.abs(s.dd),o=numericOptions(v,"km",[-60,-40,-20,20,40,60]);
    if(Number.isInteger(v)&&v%10===0&&Math.random()<.25)return inputQ(`How many kilometers did the person travel from ${formatTime(s.t1)} to ${formatTime(s.t2)}?`,v,"km","Travel distance is the absolute change in distance.");
    return mc(`How many kilometers did the person travel from ${formatTime(s.t1)} to ${formatTime(s.t2)}?`,o.options,o.idx,"Travel distance is the absolute change in distance.");
  }
  if(type==="distanceAtTime"){
    const i=randInt(1,g.times.length-1),v=g.dist[i],o=numericOptions(v,"km",[-80,-60,-40,-20,20,40,60,80]);
    if(Number.isInteger(v)&&v%10===0&&Math.random()<.25)return inputQ(`What is the distance at time ${formatTime(g.times[i])}?`,v,"km","Read the y-value at that time.");
    return mc(`What is the distance at time ${formatTime(g.times[i])}?`,o.options,o.idx,"Read the y-value at that time.");
  }
  if(type==="greatest"){
    const v=maxDistance(g),o=numericOptions(v,"km",[-80,-60,-40,-20,20,40,60,80]);
    return mc("What is the greatest distance from the start on this graph?",o.options,o.idx,"The greatest distance is the highest y-value on the graph.");
  }
  if(type==="totalTraveled"){
    const v=totalDistance(segs),o=numericOptions(v,"km",[-80,-60,-40,-20,20,40,60,80]);
    return mc("What total distance did the person travel in all?",o.options,o.idx,"Add every movement, including any distance traveled back toward the start.");
  }
  const v=g.dist[g.dist.length-1],o=numericOptions(v,"km",[-80,-60,-40,-20,20,40,60,80]);
  return mc(type==="distanceFromStartEnd"?"How far from the start is the person at the end of the graph?":"What distance is shown at the end of the graph?",o.options,o.idx,"Read the final y-value.");
}

function slopeGapOK(g){
  const mags=getSegments(g).filter(s=>s.dd!==0).map(s=>Math.abs(s.speed)).sort((a,b)=>b-a);
  return mags.length<2 || mags[0]-mags[1]>=15;
}
function build(){
  const advanced=level==="advanced";
  let g;
  for(let i=0;i<30;i++){const candidate=generateGraph(advanced);if(slopeGapOK(candidate)&&(!advanced?getSegments(candidate).every(s=>s.dd>=0):true)){g=candidate;break}}
  if(!g)g=generateGraph(advanced);
  current={graph:g,question:generateQuestion(g,advanced)};evaluated=false;drawGraph(g);renderQuestion(current.question);
}
function renderQuestion(q){
  $("question").textContent=q.prompt;$("answerArea").innerHTML="";$("checkBtn").disabled=false;$("nextBtn").disabled=true;$("feedback").className="feedback";
  if(q.type==="mc"){
    const box=document.createElement("div");box.className="choices";
    q.options.forEach((opt,i)=>{const b=document.createElement("button");b.className="choice";b.type="button";b.textContent=opt;b.dataset.index=i;b.addEventListener("click",()=>{if(evaluated)return;box.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});box.appendChild(b)});
    $("answerArea").appendChild(box);
  }else{
    const row=document.createElement("div");row.className="answer-row";
    const inp=document.createElement("input");inp.id="freeInput";inp.inputMode="decimal";inp.autocomplete="off";inp.placeholder="Type your answer";
    const u=document.createElement("span");u.className="unit";u.textContent=q.unit;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();evaluated?build():check()}});
    row.append(inp,u);$("answerArea").appendChild(row);inp.focus();
  }
}
function feedback(ok,title,text){
  $("feedback").className="feedback "+(ok?"good":"bad");$("feedbackTitle").textContent=title;$("feedbackSub").textContent=text;
}
function check(){
  if(!current||evaluated)return;const q=current.question;
  if(q.type==="mc"){
    const selected=$("answerArea").querySelector(".choice.selected");
    if(!selected){feedback(false,"Choose an answer first.","Select one option, then press Check.");return}
    const idx=Number(selected.dataset.index);evaluated=true;
    $("answerArea").querySelectorAll(".choice").forEach((b,i)=>{b.disabled=true;if(i===q.correctIndex)b.classList.add("correct");if(i===idx&&i!==q.correctIndex)b.classList.add("wrong")});
    if(idx===q.correctIndex){correctCount++;feedback(true,"Correct!",q.explanation)}else{incorrectCount++;feedback(false,"Not quite.",`Correct answer: ${q.answerText}. ${q.explanation}`)}
  }else{
    const inp=$("freeInput"),raw=inp.value.trim().replace(",",".");
    if(!raw){feedback(false,"Enter an answer first.","Type a number, then press Check.");return}
    if(!/^-?\d+(?:\.\d+)?$/.test(raw)){feedback(false,"Enter a number.","Use digits only, for example 80 or 22.5.");return}
    const val=Number(raw);evaluated=true;inp.disabled=true;
    if(Math.abs(val-Number(q.correctValue))<.05){correctCount++;feedback(true,"Correct!",q.explanation)}else{incorrectCount++;feedback(false,"Not quite.",`Correct answer: ${q.correctValue} ${q.unit}. ${q.explanation}`)}
  }
  $("correct").textContent=correctCount;$("incorrect").textContent=incorrectCount;$("checkBtn").disabled=true;$("nextBtn").disabled=false;
}
$("checkBtn").addEventListener("click",check);$("nextBtn").addEventListener("click",build);$("newBtn").addEventListener("click",build);
document.addEventListener("keydown",e=>{if($("practicePanel").style.display==="none")return;if(e.key==="Enter"&&current&&current.question.type==="mc"){e.preventDefault();evaluated?build():check()}});
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");level=b.dataset.level;$("idea").textContent=level==="basic"?"Basic: moving away, stopping, reading distances, and comparing steepness.":"Advanced: includes returning toward the start, turning around, and total distance traveled.";build()}));

function showPractice(){$("practiceTab").classList.add("active");$("worksheetTab").classList.remove("active");$("practicePanel").style.display="block";$("worksheetPanel").style.display="none"}
function showWorksheet(){$("worksheetTab").classList.add("active");$("practiceTab").classList.remove("active");$("practicePanel").style.display="none";$("worksheetPanel").style.display="block"}
$("practiceTab").addEventListener("click",showPractice);$("worksheetTab").addEventListener("click",showWorksheet);

function keyLine(q){return q.type==="mc"?q.answerText:`${q.correctValue} ${q.unit}`}
function generateWorksheet(){
  const n=Number($("wsCount").value),advanced=level==="advanced";worksheetData=[];$("wsList").innerHTML="";
  for(let i=0;i<n;i++){
    let g;for(let k=0;k<30;k++){const c=generateGraph(advanced);if(slopeGapOK(c)&&(!advanced?getSegments(c).every(s=>s.dd>=0):true)){g=c;break}}if(!g)g=generateGraph(advanced);
    const q=generateQuestion(g,advanced);drawGraph(g);const img=canvas.toDataURL("image/png");worksheetData.push({g,q,img});
    const card=document.createElement("div");card.className="ws-card";
    const image=document.createElement("img");image.src=img;image.alt=`Graph for problem ${i+1}`;
    const qt=document.createElement("div");qt.className="ws-q";qt.textContent=`${i+1}. ${q.prompt}`;
    card.append(image,qt);
    if(q.type==="mc"){const op=document.createElement("div");op.className="ws-options";op.innerHTML=q.options.map((x,j)=>`${String.fromCharCode(65+j)}) ${x}`).join("<br>");card.appendChild(op)}
    const ans=document.createElement("div");ans.className="ws-answer";ans.textContent=`Answer: ${keyLine(q)}`;card.appendChild(ans);
    const rb=document.createElement("button");rb.type="button";rb.className="no-print";rb.style.marginTop="8px";rb.textContent="Reveal";rb.addEventListener("click",()=>{ans.classList.toggle("show");rb.textContent=ans.classList.contains("show")?"Hide":"Reveal"});card.appendChild(rb);
    $("wsList").appendChild(card);
  }
  $("wsMeta").textContent=`${level==="basic"?"Basic":"Advanced"} • ${n} problems`;
  $("revealAll").disabled=$("hideAll").disabled=$("printWs").disabled=false;
  if(current)drawGraph(current.graph);
}
$("generateWs").addEventListener("click",generateWorksheet);
$("revealAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.add("show")));
$("hideAll").addEventListener("click",()=>document.querySelectorAll(".ws-answer").forEach(x=>x.classList.remove("show")));
$("printWs").addEventListener("click",()=>window.print());

build();
})();
</script>
</body>
